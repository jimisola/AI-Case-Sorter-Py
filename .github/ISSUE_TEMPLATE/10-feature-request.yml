name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement", "triage"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: This is a feature request, not a support or usage question
          required: true
        - label: I have searched existing issues and no duplicate exists
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: What problem does this address? Who is affected and in what context?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Desired solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
