name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (PEP 440, no v prefix), e.g. 0.2.0"
        required: true
        type: string
      dry-run:
        description: "Validate and preview only -- no tag pushed, no draft release created."
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version is PEP 440
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)*(a[0-9]+|b[0-9]+|rc[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$'; then
            echo "::error::Version '$VERSION' is not a valid PEP 440 version (e.g. 0.2.0, 0.2.0rc1)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag '$VERSION' already exists"
            exit 1
          fi

      - name: Generate changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --latest --unreleased --strip all
        env:
          OUTPUT: NOTES.md

      - name: Push tag
        if: ${{ !inputs.dry-run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$VERSION"
          git push origin "$VERSION"

      - name: Create draft GitHub Release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DRAFT_URL=$(gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file NOTES.md \
            --draft \
            --json url -q .url)
          {
            echo "### Release draft created"
            echo ""
            echo "**Version:** \`$VERSION\`"
            echo ""
            echo "**Draft URL:** $DRAFT_URL"
            echo ""
            echo "Review the draft and click **Publish release** to trigger the publish workflows."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: ${{ inputs.dry-run }}
        run: |
          {
            echo "### Release dry-run"
            echo ""
            echo "**Version:** \`$VERSION\`  "
            echo "**Mode:** dry-run -- no tag pushed, no release created."
            echo ""
            echo "#### Generated release notes"
            echo ""
            cat NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"
