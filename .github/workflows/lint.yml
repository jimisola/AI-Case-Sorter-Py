name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # ruff comes from the project's own dev group, so uv.lock is the single
      # source of truth for which version lints this repo -- and Renovate
      # bumps it deliberately, in a PR, instead of a new ruff release turning
      # every open PR red without anything here having changed.
      #
      # --no-install-project for the same reason bootstrap.py passes it: the
      # package itself isn't needed to lint it, and building it would fire
      # hatch-vcs's hook, which needs tags this shallow checkout doesn't have.
      - name: Install ruff from the lockfile
        run: uv sync --locked --only-group dev --no-install-project

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

  workflows:
    name: lint the workflows themselves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Digest-pinned, not just version-pinned: a GitHub release asset stays
      # mutable by its upstream owner, so the version in the URL is not on its
      # own a pin. Digest cross-checked against upstream's published
      # actionlint_1.7.7_checksums.txt.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
          ACTIONLINT_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/
          rm actionlint.tar.gz

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      # Pinned exactly, like every other tool in this workflow: a linter that
      # silently changes version is a linter that can fail a PR which changed
      # nothing.
      - name: Install zizmor
        run: pip install zizmor==1.29.0

      - name: zizmor
        run: zizmor --min-severity medium .github/workflows/

      - name: Install yamllint
        run: pip install yamllint==1.38.0

      - name: yamllint
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
            .github/workflows/

  # cliff.toml decides the released version number, and nothing else in the
  # repo encodes a version -- so a wrong answer here ships a wrong release
  # rather than just a wrong changelog line. tests/test_cliff_config.py
  # asserts the real binary's behaviour against the mapping CONTRIBUTING.md
  # publishes; it skips when git-cliff is absent, so it needs a job that
  # installs it or it would quietly never run anywhere.
  release-config:
    name: release version mapping
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      # Version and digest live in the composite action -- one place to bump.
      # This job asserts the bump mapping the docs promise, so it has to run
      # the same git-cliff build the release actually uses.
      - uses: ./.github/actions/setup-git-cliff

      - name: Install pytest from the lockfile
        run: uv sync --locked --only-group dev --no-install-project

      # -p no:randomly etc. deliberately not needed: this module builds its own
      # throwaway repos and shares no state with the rest of the suite.
      - name: Assert the bump mapping the docs publish
        run: uv run --no-sync pytest tests/test_cliff_config.py -q
