name: Label PRs

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target, not pull_request -- deliberately, and it's the
      # one place in this repo where that's correct: labeling needs
      # pull-requests: write, which a pull_request run from a fork never
      # gets. The usual danger of pull_request_target is that it runs
      # untrusted PR code with a writable token; that does not apply here
      # because this job never checks out the PR head and never executes
      # anything from it -- actions/labeler only reads the changed-file list
      # and the branch name via the API. See zizmor's dangerous-triggers
      # audit for the general rule this is a considered exception to.
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
