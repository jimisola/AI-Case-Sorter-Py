name: Verify Installer

# install-windows.ps1 is not part of the normal dev loop the way
# start.sh/start.bat are -- nobody runs it while iterating on the app, it is
# a one-shot onboarding script. It also needs a real published release to
# exercise its interesting path (sdist matching, tar.exe extraction); on a
# repo with none yet it would only ever hit the "no release, fall back to
# the source zip" branch. So this gets its own trigger rather than
# build.yml's blanket one: path-filtered on PR/push (fast feedback exactly
# when the script itself changes, near-zero cost otherwise), plus a
# workflow_call so release.yml can run it against the release it just cut.
#
# The workflow file is in its own path filter: without that, a PR editing
# only this file never runs the job it changes.
on:
  pull_request:
    paths:
      - "installer/**"
      - ".github/workflows/installer-smoke.yml"
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-smoke.yml"

  # Called by release.yml, rather than triggering on release:published.
  #
  # Two reasons it cannot be a release trigger. The sdist this exercises is
  # attached by the release job, and release:published fires alongside that
  # upload -- the race lands on the "no matching asset, fall back to the source
  # archive" branch and fails on the missing _version.py, which is exactly what
  # happened on the 1.0.0 rename. And the release under test is a *prerelease*
  # at this point, which /releases/latest deliberately excludes, so the default
  # installer path would verify the previous release and pass while proving
  # nothing about this one.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to verify. Omit to test whatever /releases/latest resolves to."
        required: false
        type: string

  # Manual runs, with the same optional pin. Useful when /releases/latest is not
  # the release you want to check -- including the case where it predates a
  # package rename and so carries an sdist the current installer cannot match.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to verify. Omit to test whatever /releases/latest resolves to."
        required: false
        type: string

permissions:
  contents: read

jobs:
  installer-smoke:
    name: verify Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs first, and needs no release: it feeds hostile entry names to the
      # validation directly. The install below only ever sees a legitimate
      # archive, so it can show the check doesn't reject good entries but
      # never that it rejects bad ones -- that half is only tested here.
      - name: Archive-entry validation
        shell: powershell
        run: .\installer\Test-ArchiveEntryValidation.ps1

      # -Repo $env:GITHUB_REPOSITORY, not the script's own hardcoded default:
      # makes this self-adapting to wherever it runs -- the fork's own real
      # releases today, whatever repo eventually hosts this upstream.
      #
      # shell: powershell (Windows PowerShell 5.1), not pwsh (PowerShell 7):
      # that is the interpreter a real double-click via install-windows.bat
      # actually uses, and the one the script's own top-of-file comment
      # calls out by name for its BOM/codepage decoding quirks -- pwsh would
      # not exercise that at all.
      #
      # Cheap up-front diagnosis. When this job fails it is usually not the
      # installer being broken but the release it resolved to not carrying an
      # sdist under the name the installer matches -- after a package rename
      # every release cut before it is in exactly that state, and the symptom
      # is an unhelpful "sorter\_version.py is missing" three steps later.
      - name: Show the release under test
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            ENDPOINT="releases/tags/$TAG"
          else
            ENDPOINT="releases/latest"
          fi
          echo "Resolving $ENDPOINT"
          gh api "repos/${GITHUB_REPOSITORY}/${ENDPOINT}" \
            --jq '"tag: \(.tag_name)   prerelease: \(.prerelease)", "assets:", (.assets[].name | "  - \(.)")' \
            || echo "::warning::No release at $ENDPOINT -- the installer will fall back to the source archive and this job will fail."

      # -NoLaunch keeps this scoped to install + extract; the full
      # bootstrap.py/uv-sync path is launcher-smoke's job, not this one's.
      #
      # -Version pins the release under test when one is passed in. Without it
      # the script resolves /releases/latest, which is the wrong target twice
      # over during a release: the new release is still a prerelease and so
      # excluded from `latest`, and any concurrent release would decide what
      # gets tested. On the path/PR triggers no tag is passed and `latest` is
      # the right answer.
      - name: Run the installer for real
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG) {
            Write-Host "Verifying release $env:TAG"
            .\installer\install-windows.ps1 -Repo $env:GITHUB_REPOSITORY -Version $env:TAG -NoLaunch
          } else {
            Write-Host "Verifying whatever /releases/latest resolves to"
            .\installer\install-windows.ps1 -Repo $env:GITHUB_REPOSITORY -NoLaunch
          }

      # The real assertion: not "the script exited 0" but "a working install
      # landed with the version the sdist actually carries" -- proves the
      # -Repo override, sdist asset-matching and tar.exe extraction all
      # worked against a real GitHub release, not a synthetic fixture.
      #
      # It does NOT prove the entry validation rejects anything: this archive
      # is legitimate, so all it shows is the check not firing on good input.
      # The rejection half is the earlier step's job.
      - name: Verify the install
        shell: powershell
        env:
          TAG: ${{ inputs.tag }}
        run: |
          $dest = "$env:LOCALAPPDATA\Programs\CaseSorter"
          if (-not (Test-Path "$dest\main.py")) {
            Write-Error "main.py is missing -- the app was not installed."
            exit 1
          }
          $versionFile = "$dest\sorter\_version.py"
          if (-not (Test-Path $versionFile)) {
            Write-Error "sorter\_version.py is missing -- installed from the source archive, not the sdist."
            exit 1
          }
          $content = Get-Content $versionFile -Raw
          Write-Host "----- sorter/_version.py -----"
          Write-Host $content
          if ($content -notmatch "__version__\s*=.*'([0-9][^']*)'") {
            Write-Error "sorter/_version.py does not carry a real version."
            exit 1
          }
          $installed = $Matches[1]

          # When a tag was passed, "a real version" is not enough -- it has to
          # be *this* release. Anything else means the installer matched some
          # other release's asset, which is precisely the silent degradation
          # this job exists to catch.
          if ($env:TAG) {
            $expected = $env:TAG -replace '^v', ''
            if ($installed -ne $expected) {
              Write-Error "Installed version '$installed' is not the release under test ('$expected')."
              exit 1
            }
            Write-Host "Installed version matches the release under test: $installed"
          }

      # The seam this job and launcher-smoke left uncovered between them, and
      # the one a real bug shipped through: this job installed with -NoLaunch
      # and never started the app, while launcher-smoke starts the app on a
      # runner where a real python is already first on PATH. Nothing exercised
      # "install, then launch, on a machine where `python` is not what you
      # think it is".
      #
      # What broke: stock Windows answers `python` with an App Execution Alias
      # stub -- zero bytes, no interpreter -- that satisfies `where python`
      # and then exits 9009. A winget-provisioned Python is not enough to save
      # it either, since winget installs Python.Python.3.13 without
      # Python.Launcher, so `py` may not exist at all.
      #
      # Simulated rather than reproduced: a runner has no App Execution Alias,
      # so the stub is a python.cmd that exits 9009 the same way, placed first
      # on PATH with the real interpreter's directory removed. py.cmd stands
      # in for the launcher, which is the route start.bat must take when the
      # name `python` is poisoned. Both are behavioural stand-ins for a state
      # this runner cannot be put into, and the assertion is the same either
      # way: bootstrap.py has to be reached.
      - name: Verify the launcher survives a poisoned `python`
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "$env:LOCALAPPDATA\Programs\CaseSorter"

          # -First 1 after filtering, not just .Source: a runner resolves
          # `python` to both the hosted toolcache and the WindowsApps alias, so
          # .Source returns an array -- which silently produced a two-path
          # py.cmd and a nonsense Split-Path. The alias is excluded explicitly
          # because it is the very thing being stubbed out below.
          $real = (Get-Command python -CommandType Application -ErrorAction SilentlyContinue |
                   Where-Object { $_.Source -notlike '*\WindowsApps\*' } |
                   Select-Object -First 1).Source
          if (-not $real) {
            Write-Error "No real python on PATH to stand the launcher shim up against."
            exit 1
          }
          Write-Host "Real interpreter: $real"

          $shim = Join-Path $env:RUNNER_TEMP 'poisoned-path'
          New-Item -ItemType Directory -Path $shim -Force | Out-Null
          @"
          @echo off
          echo Python was not found; run without arguments to install from the Microsoft Store.
          exit /b 9009
          "@ | Set-Content "$shim\python.cmd" -Encoding ascii
          # The stand-in has to *consume* the version selector the way the real
          # launcher does. Forwarding %* verbatim turned `py -3 -c pass` into
          # `python -3 -c pass`, which the interpreter rejects with "Unknown
          # option: -3" -- the shim failing, not start.bat. %1..%9 after the
          # shift keeps each argument's own quoting intact, which `%*` would
          # also have done but only by passing the selector along with it.
          $pyShim = @(
            '@echo off',
            'if "%~1"=="-3" shift',
            "`"$real`" %1 %2 %3 %4 %5 %6 %7 %8 %9"
          )
          Set-Content -Path "$shim\py.cmd" -Value $pyShim -Encoding ascii

          # Stub first, real interpreter's own directory removed: `python` now
          # behaves exactly like the alias, and only the launcher route works.
          $realDir = Split-Path $real -Parent
          $kept = ($env:PATH -split ';') | Where-Object { $_ -and $_ -notlike "$realDir*" }
          $env:PATH = (@($shim) + $kept) -join ';'

          cmd /c "python -c ""pass""" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 9009) {
            Write-Error "Setup failed: bare python should have exited 9009, got $LASTEXITCODE."
            exit 1
          }
          Write-Host "Confirmed: bare ``python`` now exits 9009, as the Store stub does."

          # The other half of the premise: the launcher stand-in has to work,
          # or this asserts nothing about start.bat and everything about a
          # broken shim -- which is exactly how the first version of this step
          # failed.
          cmd /c "py -3 -c ""pass""" 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "----- py.cmd -----"; Get-Content "$shim\py.cmd"
            Write-Error "Setup failed: the py.cmd launcher stand-in does not run (exit $LASTEXITCODE)."
            exit 1
          }
          Write-Host "Confirmed: ``py -3`` works, so start.bat has a route to take."

          $log = Join-Path $env:RUNNER_TEMP 'launch.log'
          $p = Start-Process -FilePath "$dest\start.bat" -WorkingDirectory $dest `
                 -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err"
          # main.py never exits on its own, so wait for the handoff line rather
          # than the process -- same approach as build.yml's launcher-smoke.
          $deadline = (Get-Date).AddSeconds(420)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Starting the app' -Quiet)) { $ready = $true; break }
            if ($p.HasExited) { break }
          }
          Write-Host "----- launcher output -----"
          if (Test-Path $log)       { Get-Content $log }
          if (Test-Path "$log.err") { Get-Content "$log.err" }
          if (-not $p.HasExited)    { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ready) {
            Write-Error "start.bat never reached bootstrap.py with a poisoned ``python`` -- the Store-stub regression is back."
            exit 1
          }
          Write-Host "start.bat reached the app despite a poisoned ``python``."
