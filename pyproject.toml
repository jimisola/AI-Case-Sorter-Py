[project]
name = "ai-case-sorter-py"
# Single-sourced from sorter/__init__.py so the packaged version, the version
# the in-app updater compares against, and the release tag can't drift apart.
dynamic = ["version"]
description ="Cross-platform desktop app that sorts spent brass cartridge casings by headstamp using a camera, an image classifier, and a serial-connected sorting machine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SJSeth Solutions" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "requests>=2.31",
    "msal>=1.28",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/sjseth/AI-Case-Sorter-Py"
Repository = "https://github.com/sjseth/AI-Case-Sorter-Py"
Issues = "https://github.com/sjseth/AI-Case-Sorter-Py/issues"

[project.optional-dependencies]
# Local PyTorch training/inference. Install with `pip install .[ml]`.
ml = ["torch>=2.2", "torchvision>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "sorter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sorter"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
    # Pre-existing findings as of the tool-adoption PR: real, but not a formatting
    # concern, and fixing them changes behavior (closures, exception chaining,
    # loop variables). Deferred to a follow-up review pass; see FEEDBACK.md.
    "F841",  # local variable assigned but never used
    "F811",  # redefinition of unused name
    "B023",  # function does not bind loop variable (camera.py closures)
    "B007",  # unused loop control variable
    "B017",  # assert-raises-exception too broad
    "B904",  # raise without `from` inside except
    "UP042", # str+Enum -> StrEnum (behavior differs subtly; needs its own look)
]

[tool.ruff.lint.per-file-ignores]
# Must run on whatever ancient interpreter the user's system provides, since
# its job is to provision a newer one. pyupgrade rewrites would silently
# break it on exactly the systems it exists to serve.
"bootstrap.py" = ["UP"]
# Contains an embedded HTML/JS template as a verbatim port of the legacy
# WinForms app's report (see CLAUDE.md). Whitespace inside that string is
# part of the port; don't rewrite it.
"sorter/eval_report.py" = ["W291", "W293"]

[tool.ruff.lint.isort]
known-first-party = ["sorter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The suite is threading-fragile by design (see tests/conftest.py): Tk widget
# garbage collected on a worker thread calls into Tcl from the wrong thread
# and can hang or abort the process. Do not add pytest-xdist or any plugin
# that parallelizes or reorders test execution.
