[project]
name = "ai-case-sorter-py"
# Single-sourced from sorter/__init__.py so the packaged version, the version
# the in-app updater compares against, and the release tag can't drift apart.
dynamic = ["version"]
description ="Cross-platform desktop app that sorts spent brass cartridge casings by headstamp using a camera, an image classifier, and a serial-connected sorting machine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "SJSeth Solutions" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "pyserial>=3.5",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "Pillow>=10.0",
    "requests>=2.31",
    "msal>=1.28",
    "platformdirs>=4.0",
]

[project.urls]
Homepage = "https://github.com/sjseth/AI-Case-Sorter-Py"
Repository = "https://github.com/sjseth/AI-Case-Sorter-Py"
Issues = "https://github.com/sjseth/AI-Case-Sorter-Py/issues"

[project.optional-dependencies]
# Local PyTorch training/inference. Install with `pip install .[ml]`.
ml = ["torch>=2.2", "torchvision>=0.17"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sorter", "sorter.ui", "sorter.training"]

[tool.setuptools.dynamic]
version = { attr = "sorter.__version__" }
