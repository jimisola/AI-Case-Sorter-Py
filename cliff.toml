[changelog]
header = ""
# `striptags` removes the `<!-- N -->` sort prefixes from group names.
# git-cliff orders groups by their raw string, so without a prefix they come
# out alphabetical -- which buried Features mid-list behind Bug Fixes and
# Documentation. The prefix is an HTML comment, so it stays invisible in
# rendered markdown even for a consumer that doesn't strip it.
#
# `commit.breaking` is what surfaces a breaking change. Without it a `feat!:`
# renders identically to an ordinary `feat:` -- the single most important line
# in a release note, silently indistinguishable from the rest.
body = """
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }}{% if commit.remote.pr_number %} (#{{ commit.remote.pr_number }}){% endif %}
{% endfor %}
{% endfor %}\
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true

# Order is deliberate, not alphabetical: Security first because for an app with
# an auto-updater and a community backend, "is there a fix I need urgently?"
# outranks "what's new?". Then Features and Bug Fixes, then the rest.
commit_parsers = [
  { message = "^security", group = "<!-- 0 -->Security" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^style", group = "<!-- 7 -->Style" },
  # `revert` is an allowed PR type (check-semantic-pr.yml). git-cliff would
  # auto-derive a Revert section without this line -- verified -- but it's
  # stated so all twelve allowed types are accounted for here explicitly.
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  { message = "^chore", group = "<!-- 9 -->Miscellaneous" },
  # Skipped: release notes are for people running the app, not for its build
  # system. A non-breaking workflow tweak or dependency bump isn't news.
  # But see protect_breaking_commits below -- `build!:` is very much news.
  { message = "^ci", group = "CI/CD", skip = true },
  { message = "^build", group = "Build", skip = true },
]

# Overrides the skips above for breaking changes only. This is load-bearing,
# not a nicety: this project's own `build!: require Python 3.12` would
# otherwise be dropped from the release notes entirely, so users upgrading
# would get no warning that their Python is now too old to run the app.
protect_breaking_commits = true

filter_commits = false
# PEP 440, no `v` prefix (0.2.0, 0.2.0rc1) -- see RELEASING.md.
# Anchored: git-cliff treats tag_pattern as an unanchored regex, so the
# obvious "[0-9].*" also matches any tag merely *containing* a digit --
# including the `v1.0.0` form that check-release.yml explicitly rejects. A
# stray v-tag would then silently be picked up as a release boundary.
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "newest"
